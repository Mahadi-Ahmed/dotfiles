# Worktrunk user config
# Stowed from dotfiles repo → ~/.config/worktrunk/config.toml
#
# Per-project hooks live in a separate private layer, loaded via
# WORKTRUNK_SYSTEM_CONFIG_PATH (see zshrc). Worktrunk deep-merges the two, and
# silently skips the private one when it is missing — so this file alone is a
# complete, working config.

# Subfolder pattern: worktrees live inside <repo>-worktrees/<branch>
worktree-path = "{{ repo_path }}/../{{ repo }}-worktrees/{{ branch | sanitize }}"

[list]
full = true

[merge]
# Only applies to local merges (wt merge), NOT GitHub PRs
squash = true
rebase = true
remove = true

# --- Global hooks ---

[pre-start]
# Create tmux session with layout for new worktrees (runs before per-project hooks)
tmux_session = '''
if [ -n "$TMUX" ]; then
  # tmux treats "." and ":" in session names as window.pane / session:window
  # separators, so strip them to "-" (sanitize only makes the branch path-safe).
  session=$(printf '%s' "{{ branch | sanitize }}" | tr '.:' '-')
  tmux new-session -d -s "$session" -c "{{ worktree_path }}"
  tmux new-window -t "$session" -c "{{ worktree_path }}"
  tmux split-window -h -t "$session:2" -c "{{ worktree_path }}"
  tmux split-window -v -t "$session:2.2" -c "{{ worktree_path }}"
  tmux new-window -t "$session" -c "{{ worktree_path }}"
  tmux select-window -t "$session:1"
  tmux switch-client -t "$session"
fi
'''
